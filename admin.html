<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Dilo Perdi moderation</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f2;--surface:#fff;--ink:#122a2e;--muted:#5a7175;--line:#d3dfdf;--accent:#0a6a75;--accent-ink:#fff;--bad:#c2262e;--good:#2f8a4a;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--font-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0f1c1e;--surface:#16272a;--ink:#e4efef;--muted:#9db3b6;--line:#2a3f43;--accent:#3fb6c3;--accent-ink:#06282c;--bad:#f0525a;--good:#5fc27a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-body)}
main{max-width:720px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--font-display);font-weight:800;font-size:1.5rem;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
label{font-size:.9rem;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.good{background:var(--good);color:#fff;border-color:var(--good)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:8px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
img{width:100%;max-height:320px;object-fit:cover;border-radius:10px;background:var(--bg)}
.muted{color:var(--muted);font-size:.9rem;margin:0}
.empty{text-align:center;color:var(--muted);padding:24px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between"><h1>Dilo Perdi moderation</h1><button class="btn" id="logout" hidden>Log out</button></div>

  <form class="card" id="loginForm">
    <p class="muted">Only the map owner can log in here.</p>
    <div><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
    <div><label for="pass">Password</label><input id="pass" type="password" autocomplete="current-password" required></div>
    <button class="btn primary" type="submit">Log in</button>
    <p class="muted" id="loginMsg"></p>
  </form>

  <section id="panel" hidden>
    <div class="tabs" role="tablist">
      <button class="btn" role="tab" data-tab="pending" aria-selected="true">Waiting (<span id="nPending">0</span>)</button>
      <button class="btn" role="tab" data-tab="approved" aria-selected="false">On the map (<span id="nApproved">0</span>)</button>
      <button class="btn" role="tab" data-tab="fixed" aria-selected="false">Fixed (<span id="nFixed">0</span>)</button>
    </div>
    <p class="muted" style="margin-top:10px" id="hint">Approve a report only if the photo shows a leak and no faces or car plates.</p>
    <div id="list" style="display:flex;flex-direction:column;gap:12px;margin-top:12px"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient("https://sdoxxefydlsaqzxdhjvy.supabase.co","sb_publishable_xyOYrIMR146NCu96GuWk6g_W4ocOPx3");
const SEV={drip:"Dripping",flow:"Flowing",gush:"Gushing"};
let rows=[], tab="pending";
const fmt=t=>new Date(t).toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const days=t=>Math.floor((Date.now()-new Date(t))/86400000);

async function start(){
  const {data:{session}}=await sb.auth.getSession();
  document.getElementById("loginForm").hidden=!!session;
  document.getElementById("panel").hidden=!session;
  document.getElementById("logout").hidden=!session;
  if(session) load();
}
document.getElementById("loginForm").onsubmit=async e=>{
  e.preventDefault();
  const msg=document.getElementById("loginMsg"); msg.textContent="Logging in";
  const {error}=await sb.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("pass").value});
  msg.textContent=error?"Wrong email or password.":""; start();
};
document.getElementById("logout").onclick=async()=>{ await sb.auth.signOut(); start(); };
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; document.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",x===b?"true":"false")); render(); });

async function load(){
  const {data,error}=await sb.from("reports").select("*").order("created_at",{ascending:false}).limit(1000);
  if(error){ document.getElementById("list").innerHTML='<p class="empty">Could not load reports. Reload the page.</p>'; return; }
  rows=data; render();
}
function render(){
  ["pending","approved","fixed"].forEach(s=>document.getElementById("n"+s[0].toUpperCase()+s.slice(1)).textContent=rows.filter(r=>r.status===s).length);
  document.getElementById("hint").hidden=tab!=="pending";
  const list=document.getElementById("list"); list.innerHTML="";
  const items=rows.filter(r=>r.status===tab);
  if(!items.length){ list.innerHTML='<p class="empty">Nothing here.</p>'; return; }
  items.forEach(r=>{
    const c=document.createElement("article"); c.className="card";
    const photo=sb.storage.from("photos").getPublicUrl(r.photo_path).data.publicUrl;
    c.innerHTML=`<img alt="Reported photo" src="${photo}">
      <p class="muted">${SEV[r.sev]||r.sev} · reported ${fmt(r.created_at)} · ${days(r.created_at)} days ago${r.confirms?` · ${r.confirms} confirmations`:""}</p>
      <p class="note-text" style="margin:0"></p>
      <p class="muted"><a target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${r.lat}&mlon=${r.lon}#map=18/${r.lat}/${r.lon}">See the spot on a map</a></p>
      <div class="row"></div>`;
    c.querySelector(".note-text").textContent=r.note||"";
    const row=c.querySelector(".row");
    const add=(label,cls,fn)=>{const b=document.createElement("button");b.className="btn "+cls;b.textContent=label;b.onclick=async()=>{b.disabled=true;await fn();};row.appendChild(b);};
    if(r.status==="pending"){ add("Approve","good",()=>setStatus(r,"approved")); add("Reject and delete","bad",()=>remove(r)); }
    if(r.status==="approved"){ add("Mark as fixed","good",()=>setStatus(r,"fixed")); add("Delete","bad",()=>remove(r)); }
    if(r.status==="fixed"){ add("Back on the map","",()=>setStatus(r,"approved")); add("Delete","bad",()=>remove(r)); }
    list.appendChild(c);
  });
}
async function setStatus(r,status){
  const {error}=await sb.from("reports").update({status}).eq("id",r.id);
  if(error){ alertBox("Could not save. Try again."); return; } r.status=status; render();
}
async function remove(r){
  await sb.storage.from("photos").remove([r.photo_path]);
  const {error}=await sb.from("reports").delete().eq("id",r.id);
  if(error){ alertBox("Could not delete. Try again."); return; }
  rows=rows.filter(x=>x.id!==r.id); render();
}
function alertBox(t){ const p=document.createElement("p"); p.className="empty"; p.textContent=t; document.getElementById("list").prepend(p); setTimeout(()=>p.remove(),4000); }
sb.auth.onAuthStateChange(()=>{});
start();
</script>
</body>
</html>
